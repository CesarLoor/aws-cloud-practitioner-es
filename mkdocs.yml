site_name: AWS Cloud Practitioner en español
site_description: Guía de estudio abierta para la certificación AWS Certified Cloud Practitioner (CLF-C02), con lecciones, diagramas, laboratorios prácticos y evaluaciones.
site_url: https://cesarloor.github.io/aws-cloud-practitioner-es/
repo_url: https://github.com/CesarLoor/aws-cloud-practitioner-es
repo_name: CesarLoor/aws-cloud-practitioner-es
edit_uri: edit/main/docs/
copyright: Contenido bajo CC BY-SA 4.0 · Proyecto comunitario, no afiliado a Amazon Web Services

theme:
  name: material
  custom_dir: overrides
  language: es
  icon:
    logo: material/cloud-outline
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: orange
      toggle:
        icon: material/weather-night
        name: Cambiar a modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: orange
      toggle:
        icon: material/weather-sunny
        name: Cambiar a modo claro
  features:
    - announce.dismiss
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - toc.follow

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      base_path: [!relative $config_dir]
      check_paths: true

nav:
  - Inicio:
      - index.md
      - Sílabo del curso: silabo.md
  - Entorno de práctica:
      - entorno/index.md
      - 1 · Crear tu cuenta: entorno/01-crear-cuenta.md
      - 2 · Recorrido por la consola: entorno/02-consola.md
      - 3 · Configuración base: entorno/03-configuracion-base.md
      - 4 · Limpieza y costos: entorno/04-limpieza.md
      - 5 · Documentación de apoyo: entorno/05-documentacion.md
  - Módulos:
      - modulos.md
      - Módulo 1 · Introducción a la nube:
          - modulo-01/index.md
          - 1.1 Computación en la nube: modulo-01/1-1-computacion-en-la-nube.md
          - 1.2 Infraestructura global: modulo-01/1-2-infraestructura-global.md
          - 1.3 Responsabilidad compartida: modulo-01/1-3-responsabilidad-compartida.md
          - 1.4 La nube en la vida real: modulo-01/1-4-casos-reales.md
          - Laboratorio 1: modulo-01/laboratorio.md
      - Módulo 2 · Cómputo en la nube:
          - modulo-02/index.md
          - 2.1 Introducción a Amazon EC2: modulo-02/2-1-introduccion-ec2.md
          - 2.2 Tipos de instancias: modulo-02/2-2-tipos-instancias.md
          - 2.3 Aprovisionar recursos: modulo-02/2-3-aprovisionar-recursos.md
          - 2.4 Lanzar una instancia y las AMI: modulo-02/2-4-lanzar-instancia-ami.md
          - 2.5 Precios de EC2: modulo-02/2-5-precios-ec2.md
          - 2.6 EC2 Auto Scaling: modulo-02/2-6-auto-scaling.md
          - 2.7 Elastic Load Balancing: modulo-02/2-7-elastic-load-balancing.md
          - 2.8 Mensajería y desacoplamiento: modulo-02/2-8-mensajeria-desacoplamiento.md
          - Laboratorio 2: modulo-02/laboratorio.md
      - Módulo 3 · Servicios de cómputo:
          - modulo-03/index.md
          - 3.1 Administrados y sin servidor: modulo-03/3-1-administrados-sin-servidor.md
          - 3.2 AWS Lambda: modulo-03/3-2-aws-lambda.md
          - 3.3 Contenedores: modulo-03/3-3-contenedores.md
          - 3.4 Otros servicios de cómputo: modulo-03/3-4-otros-servicios-computo.md
          - Laboratorio 3: modulo-03/laboratorio.md
      - Módulo 4 · Hacia la globalización:
          - modulo-04/index.md
          - 4.1 Elegir regiones: modulo-04/4-1-elegir-regiones.md
          - 4.2 Infraestructura global: modulo-04/4-2-infraestructura-global.md
          - 4.3 IaC y CloudFormation: modulo-04/4-3-iac-cloudformation.md
          - Laboratorio 4: modulo-04/laboratorio.md
      - Módulo 5 · Redes:
          - modulo-05/index.md
          - 5.1 VPC y subredes: modulo-05/5-1-vpc-subredes.md
          - 5.2 Puertas de enlace y VPN: modulo-05/5-2-puertas-enlace-vpn.md
          - 5.3 Más formas de conectarse: modulo-05/5-3-conectividad.md
          - 5.4 Grupos de seguridad y ACL: modulo-05/5-4-grupos-seguridad-acl.md
          - 5.5 Demostración de Amazon VPC: modulo-05/5-5-demostracion-vpc.md
          - Laboratorio 5: modulo-05/laboratorio.md
  - Repaso:
      - Repaso rápido: repaso/repaso-rapido.md
      - Simulacro · Módulos 1 a 5: repaso/simulacro.md
      - Glosario: repaso/glosario.md
